[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

[[redirects]]
  from = "/api/*"
  to = "https://splitsnap-wrrg.onrender.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/socket.io/*"
  to = "https://splitsnap-wrrg.onrender.com/socket.io/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
